name: Mobile Shell v22 phase 1 once
on:
  push:
    branches: [mobile-shell-v22]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-shell-v22
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply phase 1 ownership migration
        run: node scripts/mobile-shell-v22-phase1-once.mjs
      - name: Verify targeted contracts
        run: node --test scripts/test-mobile-shell-v22.mjs scripts/test-navigation-first-click.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start Mobile Shell v22 ownership cleanup"
          git push origin HEAD:mobile-shell-v22
