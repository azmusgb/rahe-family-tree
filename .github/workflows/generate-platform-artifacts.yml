name: Generate platform artifacts

on:
  push:
    branches: [platform/v13-full-block]

permissions:
  contents: write

concurrency:
  group: generate-platform-v13-full-block
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated platform]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/v13-full-block
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete canonical/platform regression before publishing generated data
        run: npm test
      - name: Commit deterministic generated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/corpus.json \
            public/coverage.json \
            public/redactions.json \
            public/research-model.json \
            public/semantic-audit.json \
            public/canonical-graph.json \
            public/provenance-index.json \
            public/canonical-diff.json
          if git diff --cached --quiet; then
            echo 'Generated artifacts already deterministic.'
            exit 0
          fi
          git commit -m 'chore: publish deterministic platform artifacts [generated platform]'
          git push origin HEAD:platform/v13-full-block
