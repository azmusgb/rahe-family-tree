name: Deploy production to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: 1b3ef6d9-2b3a-47c4-8bc4-c3185ce94a87
  PRODUCTION_URL: https://rahe-family-tree.netlify.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deploy credential exists
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Validate canonical model and application
        run: npm test

      - name: Build exact commit fingerprint
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy current commit to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --message="GitHub ${GITHUB_SHA}"

      - name: Verify production fingerprint
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 \
              "$PRODUCTION_URL/build-info.json?sha=$EXPECTED_SHA" \
              -o /tmp/build-info.json; then
              LIVE_SHA=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/build-info.json','utf8'));process.stdout.write(String(x.gitSha||''))")
              LIVE_RELEASE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/build-info.json','utf8'));process.stdout.write(String(x.release||''))")
              echo "Production reports release $LIVE_RELEASE at $LIVE_SHA"
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                echo "Production matches GitHub commit $EXPECTED_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production fingerprint did not converge to $EXPECTED_SHA"
          cat /tmp/build-info.json 2>/dev/null || true
          exit 1
