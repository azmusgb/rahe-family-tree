name: Regenerate safe CSS cleanup once

on:
  push:
    branches:
      - css-forensic-cleanup-v20-1
    paths:
      - .github/workflows/css-regenerate-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore pre-cleanup core and apply hardened safe cleanup
        run: |
          git checkout 5cd9efce68da7ad4f28aa831d11193a80bc40aab -- src/styles/core.css
          node scripts/css-forensics.mjs --fix-core
          node scripts/css-forensics.mjs --assert-core-clean
      - name: Commit regenerated core and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/css-regenerate-once.yml
          git add src/styles/core.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Regenerate core cleanup with fallback-safe rules"
          git push origin HEAD:css-forensic-cleanup-v20-1
