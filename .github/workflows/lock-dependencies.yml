name: Refresh dependency lock

on:
  push:
    branches: [platform/v13-full-block]

permissions:
  contents: write

concurrency:
  group: refresh-lock-v13-full-block
  cancel-in-progress: true

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/v13-full-block
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: refresh package lock [lockfile]'
          git push origin HEAD:platform/v13-full-block
