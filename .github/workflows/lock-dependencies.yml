name: Lock dependencies

on:
  push:
    branches: [platform/v13-full-block]

permissions:
  contents: write

concurrency:
  group: lock-dependencies-v13-full-block
  cancel-in-progress: true

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/v13-full-block
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve exact dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Pin direct dependencies to resolved versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for (const section of ['dependencies','devDependencies']) {
            for (const name of Object.keys(pkg[section] || {})) {
              const resolved = lock.packages?.[`node_modules/${name}`]?.version;
              if (!resolved) throw new Error(`Unable to resolve ${name}`);
              pkg[section][name] = resolved;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency graph already locked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: pin dependencies and add lockfile [lockfile]'
          git push origin HEAD:platform/v13-full-block
