name: Generate mobile CSS ownership report

on:
  push:
    branches:
      - css-mobile-ownership-v20-2

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-mobile-ownership-v20-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate ownership report
        run: node scripts/css-mobile-ownership-audit.mjs
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/css-mobile-ownership-report.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Generate mobile CSS ownership report"
          git push origin HEAD:css-mobile-ownership-v20-2
