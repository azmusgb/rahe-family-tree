name: Refresh selector report once

on:
  push:
    branches:
      - css-canonical-selectors-v20-4b

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-canonical-selectors-v20-4b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate corrected selector ledger
        run: node scripts/css-versioned-selector-audit.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/css-versioned-selector-report.json
          git commit -m "Refresh selector inventory counts"
          git push origin HEAD:css-canonical-selectors-v20-4b
