name: One-shot CSS ownership baseline

on:
  push:
    branches: [refactor/css-architecture-consolidation]
    paths:
      - scripts/css-architecture-audit.mjs
      - .github/workflows/css-audit-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-architecture-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/css-architecture-audit.mjs --write-baseline
      - name: Commit explicit ownership baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/ownership-exceptions.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh CSS ownership exception baseline [css-audit-baseline]"
          git push origin HEAD:refactor/css-architecture-consolidation
