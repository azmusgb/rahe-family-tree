name: Fix mobile search focus once

on:
  push:
    branches:
      - css-consolidation-v20

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-consolidation-v20
          fetch-depth: 0
      - name: Patch mobile People search focus handoff
        run: python3 scripts/fix_mobile_search_focus.py
      - name: Syntax check runtime
        run: node --check src/runtime/mobile-ui-shell.js
      - name: Remove one-time patch files
        run: rm scripts/fix_mobile_search_focus.py .github/workflows/fix-mobile-search-focus-once.yml
      - name: Commit focus fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize mobile People search focus handoff"
          git push origin HEAD:css-consolidation-v20
