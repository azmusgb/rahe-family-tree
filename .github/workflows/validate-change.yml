name: Validate change

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-change-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PR validation is intentionally split by failure domain. The required `validate`
# job is a stable aggregator for branch protection; expensive release/deployment
# work belongs on main, not in the PR critical path.
jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Syntax-check shared application entry points
        run: |
          node --check app-entry.js
          node --check core.js
          node --check v11.js
          node --check src/runtime/experience-core.js
          node --check src/runtime/navigation-shell.js

  canonical:
    name: canonical integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical model and verify integrity
        run: npm run build-model
      - name: Run canonical, export, ingestion, and platform contracts
        run: |
          node --test scripts/test.mjs scripts/test-canonical-integrity.mjs scripts/test-exports.mjs scripts/test-record-ingestion.mjs scripts/test-v13-0.mjs scripts/test-v13-platform.mjs
          node --check canonical-graph-engine.js
          node --check platform-v13-ui.js
          node --check platform-v13-runtime.js
          node --check src/ingestion/record-ingestion-core.js

  experience:
    name: experience contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare generated model used by experience contracts
        run: npm run build-model
      - name: Run current shell, navigation, graph, tree, research, and accessibility contracts
        run: |
          node --test scripts/test-v15-6.mjs scripts/test-v17-5.mjs scripts/test-v17-6.mjs scripts/test-v18.mjs scripts/test-v18-5.mjs scripts/test-v18-6-ui.mjs scripts/test-tree-advanced.mjs scripts/test-research-automation.mjs scripts/test-v19-family-graph.mjs scripts/test-v19-1-family-navigation.mjs scripts/test-v19-2-family-layout.mjs scripts/test-v19-3-relationship-navigator.mjs scripts/test-v19-4-relationship-path.mjs
          node --check src/runtime/family-branches-v17-5.js
          node --check src/runtime/native-family-v17-controller.js
          node --check src/runtime/tree-controller.js
          node --check src/runtime/tree-advanced.js
          node --check src/runtime/family-graph-v19.js
          node --check src/runtime/family-graph-navigation.js
          node --check src/runtime/family-graph-layout.js
          node --check src/runtime/relationship-path-comprehension.js
          node --check research-automation.js
          node --check research-intelligence.js

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact PR revision
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Verify canonical build outputs
        run: |
          test -f dist/build-info.json
          test -f dist/canonical-completeness.json
          test -f dist/canonical-graph.json
          test -f dist/provenance-index.json
          test -f dist/canonical-diff.json
          node -e "const g=require('./dist/canonical-graph.json'),d=require('./dist/canonical-diff.json');if(g.integrity?.pass!==true||d.hasCanonicalLoss||d.hasEvidencePromotion)process.exit(1)"
      - name: Upload exact site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.event.pull_request.number || github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: browser smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact verified build
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.event.pull_request.number || github.run_id }}
          path: dist
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run Chromium PR smoke suite
        timeout-minutes: 6
        env:
          CI: '1'
        run: npx playwright test --project=chromium --workers=2
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.event.pull_request.number || github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: validate
    if: always()
    needs: [core, canonical, experience, build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required PR gates
        env:
          CORE: ${{ needs.core.result }}
          CANONICAL: ${{ needs.canonical.result }}
          EXPERIENCE: ${{ needs.experience.result }}
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          printf 'core=%s\ncanonical=%s\nexperience=%s\nbuild=%s\nbrowser=%s\n' "$CORE" "$CANONICAL" "$EXPERIENCE" "$BUILD" "$BROWSER"
          test "$CORE" = success
          test "$CANONICAL" = success
          test "$EXPERIENCE" = success
          test "$BUILD" = success
          test "$BROWSER" = success
