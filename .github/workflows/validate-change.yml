name: Validate change

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-change-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Run canonical and experience regression suite
        run: npm test
      - name: Run v17.5-v18 family shell, stabilization, canonical platform, and consolidated tree gates
        run: |
          node --test scripts/test-v17-5.mjs scripts/test-v17-6.mjs scripts/test-v18.mjs scripts/test-tree-advanced.mjs
          node --check src/runtime/family-branches-v17-5.js
          node --check src/runtime/navigation-shell.js
          node --check src/runtime/native-family-v17-controller.js
          node --check src/runtime/tree-controller.js
          node --check src/runtime/v17-6-stability.js
          node --check src/runtime/tree-advanced.js
          node --check canonical-graph-engine.js
          node --check platform-v13-ui.js
          node --check platform-v13-runtime.js
      - name: Verify production build
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run build
          test -f dist/canonical-completeness.json
          test -f dist/canonical-graph.json
          test -f dist/provenance-index.json
          test -f dist/canonical-diff.json
          node -e "const b=require('./dist/build-info.json'),g=require('./dist/canonical-graph.json'),d=require('./dist/canonical-diff.json');if(b.appVersion!=='18.0.0'||b.releaseTrain!=='v18-canonical-platform'||g.integrity?.pass!==true||d.hasCanonicalLoss||d.hasEvidencePromotion)process.exit(1)"
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Run bounded browser interaction suite
        timeout-minutes: 12
        env:
          CI: '1'
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.event.pull_request.number || github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.event.pull_request.number || github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
