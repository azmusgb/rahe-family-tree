name: Validate change

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-change-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: prepare release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Run canonical and experience regression suite
        run: npm test
      - name: Run v17.5-v19 family shell, canonical platform, consolidated tree, research intelligence, Family Graph, navigation, layout, relationship navigator, and path comprehension gates
        run: |
          node --test scripts/test-v17-5.mjs scripts/test-v17-6.mjs scripts/test-v18.mjs scripts/test-v18-5.mjs scripts/test-tree-advanced.mjs scripts/test-research-automation.mjs scripts/test-v19-family-graph.mjs scripts/test-v19-1-family-navigation.mjs scripts/test-v19-2-family-layout.mjs scripts/test-v19-3-relationship-navigator.mjs scripts/test-v19-4-relationship-path.mjs
          node --check src/runtime/family-branches-v17-5.js
          node --check src/runtime/navigation-shell.js
          node --check src/runtime/native-family-v17-controller.js
          node --check src/runtime/tree-controller.js
          node --check src/runtime/v17-6-stability.js
          node --check src/runtime/tree-advanced.js
          node --check src/runtime/family-graph-v19.js
          node --check src/runtime/family-graph-navigation.js
          node --check src/runtime/family-graph-layout.js
          node --check src/runtime/relationship-path-comprehension.js
          node --check canonical-graph-engine.js
          node --check platform-v13-ui.js
          node --check platform-v13-runtime.js
          node --check research-automation.js
          node --check research-intelligence.js
          node --check v11.js
      - name: Verify production build
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run build
          test -f dist/canonical-completeness.json
          test -f dist/canonical-graph.json
          test -f dist/provenance-index.json
          test -f dist/canonical-diff.json
          node -e "const b=require('./dist/build-info.json'),g=require('./dist/canonical-graph.json'),d=require('./dist/canonical-diff.json');if(b.appVersion!=='20.0.0'||b.releaseTrain!=='v20-mobile-app'||g.integrity?.pass!==true||d.hasCanonicalLoss||d.hasEvidencePromotion)process.exit(1)"
      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.event.pull_request.number || github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: browser shard ${{ matrix.id }}/4
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: '1/4'
          - id: 2
            shard: '2/4'
          - id: 3
            shard: '3/4'
          - id: 4
            shard: '4/4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download verified production build
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.event.pull_request.number || github.run_id }}
          path: dist
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run browser interaction shard
        timeout-minutes: 9
        env:
          CI: '1'
        run: npx playwright test --shard=${{ matrix.shard }}
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.event.pull_request.number || github.run_id }}-shard-${{ matrix.id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: validate
    if: always()
    needs:
      - prepare
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all release gates passed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "prepare=${PREPARE_RESULT}"
          echo "browser=${BROWSER_RESULT}"
          test "${PREPARE_RESULT}" = "success"
          test "${BROWSER_RESULT}" = "success"
