name: Retire legacy CSS

on:
  push:
    branches:
      - v18-2-retire-legacy-css

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[css-retired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v18-2-retire-legacy-css
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retire historical selectors
        run: node scripts/retire-legacy-css.mjs
      - name: Modernize release CSS tests
        run: node scripts/modernize-style-tests.mjs
      - name: Commit migrated semantic CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Complete semantic CSS test migration [css-retired]"
          git push origin HEAD:v18-2-retire-legacy-css
