name: One-shot CSS architecture migration

on:
  push:
    branches: [refactor/css-architecture-consolidation]
    paths:
      - scripts/css-architecture-migrate.mjs

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[css-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-architecture-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic CSS architecture migration
        run: node scripts/css-architecture-migrate.mjs
      - name: Commit migrated semantic CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate CSS ownership [css-migrated]"
          git push origin HEAD:refactor/css-architecture-consolidation
