name: Fix nav first-click reliability once

on:
  push:
    branches:
      - fix-nav-first-click-v20-3

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-nav-first-click-v20-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply first-click reliability repair
        run: node scripts/fix-nav-first-click-once.mjs
      - name: Run targeted navigation regression tests
        run: node --test scripts/test-navigation-first-click.mjs scripts/test-v20-2-route-loader.mjs scripts/test-v17-1.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit repair and permanent tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix first-click navigation reliability"
          git push origin HEAD:fix-nav-first-click-v20-3
