name: Migrate person header selector once

on:
  push:
    branches:
      - css-canonical-selectors-v20-4i-person-header

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-canonical-selectors-v20-4i-person-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate person header semantic class and refresh inventory
        run: |
          node scripts/migrate-person-header-class.mjs
          node scripts/css-versioned-selector-audit.mjs
          node -e "const r=require('./docs/css-versioned-selector-report.json');if(r.inventory.some(x=>x.className==='v17-person-header'))process.exit(1)"
      - name: Run person/profile/CSS-sensitive regressions
        run: node --test scripts/test-v16-2.mjs scripts/test-v17-1.mjs scripts/test-v17-4.mjs scripts/test-v18-6-ui.mjs scripts/test-v20-2-route-loader.mjs
      - name: Run production build
        run: npm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src scripts e2e docs/css-versioned-selector-report.json
          git commit -m "Migrate person header selector"
          git push origin HEAD:css-canonical-selectors-v20-4i-person-header
